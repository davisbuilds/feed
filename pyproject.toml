[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feed"
version = "0.3.2"
description = "Your newsletter digest CLI"
authors = [{name = "davisbuilds"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.46.0",
    "feedparser>=6.0.14",
    "resend>=2.52.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pyyaml>=6.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "typer>=0.28.0",
    "click>=8.5.1,<9.0.0",  # WHY: directly imported for CLI parameter metadata
    "rich>=15.0.0",
    "python-dateutil>=4.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.6.0"]
gemini = ["google-genai>=2.34.0"]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
]

[project.scripts]
feed = "feed.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ERA", "RUF", "PIE"]

[tool.hatch.build.targets.wheel]
packages = ["src/feed"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
# WHY: the delay gives the registry and consumers time to detect compromised releases.
# For an urgent fix, override one package with exclude-newer-package.
exclude-newer = "7 days"
