[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feed"
version = "0.3.2"
description = "Your newsletter digest CLI"
authors = [{name = "davisbuilds"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.29.0",          # Primary LLM provider
    "feedparser>=6.0.14",      # RSS parsing
    "resend>=2.49.1",          # Email delivery
    "httpx>=0.27.0",          # HTTP client (used by anthropic)
    "beautifulsoup4>=4.15.0", # HTML parsing
    "lxml>=6.1.3",            # Fast HTML/XML parser
    "pyyaml>=6.0.0",          # Config files
    "pydantic>=2.14.1",        # Data validation
    "pydantic-settings>=2.15.0", # Environment config
    "typer>=0.27.3",          # CLI framework
    "click>=8.5.0,<9.0.0",    # Directly imported for CLI parameter metadata
    "rich>=15.0.0",           # Beautiful terminal output
    "python-dateutil>=2.9.0", # Date parsing
    "jinja2>=3.1.0",          # Email templates
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.13.0"]
gemini = ["google-genai>=2.29.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
]

[project.scripts]
feed = "feed.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ERA", "RUF", "PIE"]

[tool.hatch.build.targets.wheel]
packages = ["src/feed"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
# Supply-chain quarantine: ignore distributions uploaded in the last 7 days.
# For an urgent fix, override one package with exclude-newer-package.
exclude-newer = "7 days"
# Security exception: certifi 2026.10.19 distrusts the compromised eMudhra/emSign
# root (GHSA-6q48-6c7w-9gw2). Remove once it ages past the 7-day window.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
