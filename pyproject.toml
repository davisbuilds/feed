[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feed"
version = "0.3.0"
description = "Your newsletter digest CLI"
authors = [{name = "davisbuilds"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.16.2",          # Primary LLM provider
    "feedparser>=6.0.14",      # RSS parsing
    "resend>=2.47.0",          # Email delivery
    "httpx>=0.27.0",          # HTTP client (used by anthropic)
    "beautifulsoup4>=4.15.0", # HTML parsing
    "lxml>=6.1.3",            # Fast HTML/XML parser
    "pyyaml>=6.0.0",          # Config files
    "pydantic>=2.13.5",        # Data validation
    "pydantic-settings>=2.15.0", # Environment config
    "typer>=0.27.2",          # CLI framework
    "click>=8.5.0,<9.0.0",    # Directly imported for CLI parameter metadata
    "rich>=15.0.0",           # Beautiful terminal output
    "python-dateutil>=2.9.0", # Date parsing
    "jinja2>=3.1.0",          # Email templates
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.7.0"]
gemini = ["google-genai>=2.24.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

[project.scripts]
feed = "feed.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ERA", "RUF", "PIE"]

[tool.hatch.build.targets.wheel]
packages = ["src/feed"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
